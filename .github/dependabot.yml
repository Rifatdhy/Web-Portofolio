version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Batch low-risk bumps into one PR to keep the queue readable.
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # Types must track the runtime pinned in .node-version (22), not the
      # newest published major. Bumping ahead of the runtime lets CI pass on
      # APIs that don't exist in production. Remove when .node-version moves.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # eslint-config-next@16 bundles eslint-plugin-react@^7, which calls the
      # `context.getFilename()` API that ESLint 10 removed — `npm run lint`
      # dies with "contextOrFilename.getFilename is not a function". Remove
      # once eslint-config-next supports ESLint 10.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "chore(ci)"
