name: Verify

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Dependency audit
        # Gate production dependencies. Full `npm audit` is currently clean
        # too, but keeping --omit=dev avoids a dev-only advisory blocking
        # deploys; those remain visible through Dependabot.
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build
